name: DDak source audit and tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'projects/**'
      - 'tools/ddak_ci.py'
      - '.github/workflows/ddak-ci.yml'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'projects/**'
      - 'tools/ddak_ci.py'
      - '.github/workflows/ddak-ci.yml'
  schedule:
    # 23:20 UTC = 08:20 KST the following day; GitHub may delay runs.
    - cron: '20 23 * * *'

permissions:
  contents: read

concurrency:
  group: ddak-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Detect secrets, projects, and test failures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect and test detected projects
        run: python3 tools/ddak_ci.py

  field-security:
    name: Field AI365 Firebase rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect Field AI365 source and require its test lockfile
        id: detect
        run: |
          if test -d apps/field-ai365; then
            test -f apps/field-ai365/qa/package-lock.json
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Node.js
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Setup Java for Firebase emulators
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated security test dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/field-ai365/qa
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile rules and test access using synthetic accounts
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/field-ai365/qa
        env:
          CI: 'true'
        run: npm run test:rules

  field-browser:
    name: Field AI365 browser workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect Field AI365 source
        id: detect
        run: |
          if test -d apps/field-ai365; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Node.js
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test runtime
        if: steps.detect.outputs.present == 'true'
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Exercise daily workflows, offline reopen and responsive layouts
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/field-ai365
        run: |
          npm start > /tmp/field365-server.log 2>&1 &
          field_server_pid=$!
          trap 'kill "$field_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3650/ > /dev/null; then break; fi
            sleep 1
          done
          python tools/browser-check.py
          python tools/accessibility-check.py
      - name: Preserve synthetic UI and PDF evidence
        if: always() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: field-ai365-browser-evidence
          path: apps/field-ai365/evidence/
          retention-days: 7

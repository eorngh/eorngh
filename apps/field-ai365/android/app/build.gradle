plugins { id 'com.android.application' }
android {
 namespace 'kr.co.hyeonjang.ai365'
 compileSdk 36
 defaultConfig { applicationId 'kr.co.hyeonjang.ai365'; minSdk 26; targetSdk 36; versionCode 2; versionName '0.2.0' }
 signingConfigs {
  release {
   if (System.getenv('HJ365_KEYSTORE')) {
    storeFile file(System.getenv('HJ365_KEYSTORE'))
    storePassword System.getenv('HJ365_STORE_PASSWORD')
    keyAlias System.getenv('HJ365_KEY_ALIAS')
    keyPassword System.getenv('HJ365_KEY_PASSWORD')
   }
  }
 }
 buildTypes { release { minifyEnabled false; if(System.getenv('HJ365_KEYSTORE')) signingConfig signingConfigs.release } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'androidx.credentials:credentials:1.3.0'
 implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
 implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
tasks.matching { it.name in ['assembleRelease','bundleRelease'] }.configureEach {
 doFirst { if (!System.getenv('HJ365_KEYSTORE')) throw new GradleException('Release 서명 키를 설정하세요. 기존 키를 임의로 교체하지 않습니다.') }
}

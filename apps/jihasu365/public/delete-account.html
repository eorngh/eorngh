<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f2742"><title>계정 삭제 · 지하수365</title><style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f7fb;color:#172033;margin:0}.wrap{max-width:620px;margin:7vh auto;padding:16px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:28px;box-shadow:0 12px 40px rgba(15,39,66,.07)}h1{margin-top:0}.warn{background:#fff5f5;border:1px solid #fed7d7;border-radius:12px;padding:14px;color:#9b2c2c;line-height:1.6}.info{background:#f5f8fc;border-radius:12px;padding:14px;margin:14px 0;line-height:1.6}.btn{border:0;border-radius:11px;padding:13px 16px;font-weight:700;cursor:pointer;width:100%;margin-top:10px}.primary{background:#0f2742;color:#fff}.danger{background:#b42318;color:#fff}.soft{background:#eaf0f7;color:#172033}.hidden{display:none}.status{margin-top:14px;color:#5b6574;line-height:1.5}a{color:#1b5ea8}</style></head><body><div class="wrap"><div class="card"><h1>지하수365 계정 삭제</h1><p>앱을 사용할 수 없는 경우에도 이 페이지에서 본인 Google 계정으로 로그인한 뒤 계정 삭제를 요청할 수 있습니다.</p><div class="warn"><b>삭제 전 확인</b><br>직원 계정은 개인 계정정보가 삭제되고 회사 공동 업무기록의 작성자 식별정보가 익명화됩니다. 대표 계정은 회사의 현장·공사일보·문서·사진 등 작업공간 전체가 삭제됩니다. 삭제 후 복구할 수 없습니다.</div>
<div id="signedOut"><button id="login" class="btn primary">Google 계정으로 본인 확인</button></div>
<div id="signedIn" class="hidden"><div id="who" class="info"></div><button id="deleteBtn" class="btn danger">계정 및 관련 데이터 삭제</button><button id="logout" class="btn soft">로그아웃</button></div><div id="status" class="status">로그인 후 삭제할 계정을 확인하세요.</div><p style="margin-top:22px;font-size:13px"><a href="/privacy.html">개인정보 처리방침</a> · <a href="/">앱으로 돌아가기</a></p></div></div>
<script type="module">
const $=id=>document.getElementById(id); let auth,fn,mod,user,profile;
function status(s){$('status').textContent=s}
async function init(){try{const cfg=await (await fetch('/__/firebase/init.json',{cache:'no-store'})).json();const appMod=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js');const authMod=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js');const fnMod=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-functions.js');const fsMod=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');mod={...authMod,...fnMod,...fsMod};const app=appMod.initializeApp(cfg);auth=authMod.getAuth(app);fn=fnMod.getFunctions(app,'asia-northeast3');const db=fsMod.getFirestore(app);authMod.onAuthStateChanged(auth,async u=>{user=u;$('signedOut').classList.toggle('hidden',!!u);$('signedIn').classList.toggle('hidden',!u);if(!u){status('로그인 후 삭제할 계정을 확인하세요.');return}const snap=await fsMod.getDoc(fsMod.doc(db,'users',u.uid));profile=snap.exists()?snap.data():{};const role=profile.role==='owner'?'대표':profile.role||'사용자';$('who').innerHTML='<b>'+String(u.email||'')+'</b><br>권한: '+role;status('본인 계정이 맞는지 확인한 뒤 삭제하세요.');});}catch(e){status('페이지 초기화 실패: '+(e.message||e))}}
$('login').onclick=async()=>{try{const p=new mod.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});await mod.signInWithPopup(auth,p)}catch(e){status('로그인 실패: '+(e.message||e))}};
$('logout').onclick=()=>mod.signOut(auth);
$('deleteBtn').onclick=async()=>{if(!user)return;const owner=profile?.role==='owner';if(!confirm(owner?'대표 계정을 삭제하면 회사 작업공간 전체가 삭제됩니다. 계속할까요?':'계정과 개인 식별정보를 삭제할까요?'))return;const t=prompt('최종 확인을 위해 “삭제”라고 입력해 주세요.');if(t!=='삭제'){status('삭제가 취소되었습니다.');return}const b=$('deleteBtn');b.disabled=true;b.textContent='삭제 처리 중...';try{const call=mod.httpsCallable(fn,'deleteMyAccount');await call({confirm:true});location.replace('/account-deleted.html')}catch(e){b.disabled=false;b.textContent='계정 및 관련 데이터 삭제';status('삭제 실패: '+(e.message||e))}};
init();
</script></body></html>
